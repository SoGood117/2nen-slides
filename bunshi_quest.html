<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分詞クエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4f6ff; --panel:#121633; --panel2:#1d2550; --border:#4a5bd0;
    --accent:#ffd24a; --good:#5bd66b; --bad:#ff6b6b; --hp:#5bd66b; --mp:#53b9ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'DotGothic16','Press Start 2P',monospace;
    background:#05061a;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:10px;
  }
  #game{
    width:100%;max-width:560px;
    background:
      radial-gradient(120% 90% at 50% -10%, #2a1d5e 0%, #0b0f2e 55%, #05061a 100%);
    border:4px solid var(--border);
    border-radius:14px;
    box-shadow:0 0 0 4px #05061a, 0 10px 40px rgba(0,0,0,.6);
    overflow:hidden;
    position:relative;
  }
  .screen{display:none;padding:16px;}
  .screen.active{display:block;}

  /* ---- title ---- */
  #titleScreen{text-align:center;padding:26px 16px 30px;}
  .title-logo{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(18px,6.5vw,30px);
    color:var(--accent);
    text-shadow:3px 3px 0 #b5141d, 6px 6px 0 #000;
    letter-spacing:1px;line-height:1.5;margin:6px 0 2px;
  }
  .title-sub{font-size:15px;color:#bcd0ff;margin:0 0 14px;letter-spacing:2px;}
  .stage-art{
    width:100%;aspect-ratio:16/9;position:relative;margin:4px 0 14px;
    background:#0d1540 center/cover no-repeat;
    border:3px solid var(--border);border-radius:10px;overflow:hidden;
    image-rendering:pixelated;
  }
  .stage-art .star{position:absolute;width:2px;height:2px;background:#fff;opacity:.8;}
  .big-sprite{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    animation:bob 1s steps(2) infinite;image-rendering:pixelated;}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-6px);}}
  .note{font-size:12.5px;color:#9fb0e8;line-height:1.7;margin:12px 4px 0;}
  .bgm-hint{font-size:12px;color:#ffd24a;margin:2px 0 8px;animation:blink 1.2s steps(2) infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
  .qr-box{display:flex;align-items:center;justify-content:center;gap:12px;
    margin:14px auto 2px;background:#fff;border:3px solid var(--border);
    border-radius:12px;padding:10px 14px;max-width:360px;}
  .qr-box img{image-rendering:pixelated;border-radius:4px;flex:none;}
  .qr-cap{font-size:12px;color:#243a86;text-align:left;line-height:1.5;}
  .qr-cap span{font-size:10px;color:#5a6aa8;word-break:break-all;}

  button.btn{
    font-family:inherit;cursor:pointer;
    background:var(--panel2);color:var(--ink);
    border:3px solid var(--border);border-radius:10px;
    padding:12px 18px;font-size:16px;margin:6px 4px;
    box-shadow:0 4px 0 #0a0f30;transition:transform .05s;
  }
  button.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a0f30;}
  button.btn.primary{background:var(--accent);color:#2a1800;border-color:#b58a12;box-shadow:0 4px 0 #7a5c08;}
  button.btn:disabled{opacity:.45;cursor:default;}

  /* ---- battle ---- */
  .topbar{display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:#bcd0ff;margin-bottom:6px;}
  .lv{color:var(--accent);}
  .enemy-stage{
    position:relative;height:200px;border:3px solid var(--border);border-radius:10px;
    background:linear-gradient(#141c4e,#243a86 68%,#3a5730 68%,#28401f);
    overflow:hidden;margin-bottom:8px;
  }
  .enemy-wrap{position:absolute;top:18px;left:50%;transform:translateX(-50%);text-align:center;}
  .enemy-sprite{image-rendering:pixelated;animation:bob 1.1s steps(2) infinite;}
  .enemy-sprite.hit{animation:hit .4s;}
  @keyframes hit{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);filter:brightness(2);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
  .enemy-name{font-size:13px;margin-top:4px;color:#fff;text-shadow:1px 1px 0 #000;}
  .bar{height:12px;background:#0a0f30;border:2px solid #000;border-radius:6px;overflow:hidden;margin:3px auto;width:160px;}
  .bar > i{display:block;height:100%;background:var(--bad);transition:width .4s;}
  .hp-bar > i{background:var(--hp);}

  .party{display:flex;gap:6px;align-items:flex-end;position:absolute;bottom:6px;left:8px;}
  .party .p{image-rendering:pixelated;}
  .herohp{position:absolute;bottom:8px;right:8px;text-align:right;}
  .herohp .lbl{font-size:11px;color:#cfe0ff;}

  #msg{min-height:44px;font-size:14px;line-height:1.6;background:#0a0f30;
    border:3px solid var(--border);border-radius:10px;padding:10px 12px;margin:8px 0;}
  #msg b{color:var(--accent);}
  .msg-good{color:var(--good);} .msg-bad{color:var(--bad);}

  .jp-q{font-size:16px;margin:6px 2px 10px;color:#fff;}
  .jp-q::before{content:"📜 ";}

  /* word sort */
  .answer-line{min-height:46px;border:3px dashed #3a4aa8;border-radius:10px;
    padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;background:#0c1232;}
  .pool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .chip{font-family:inherit;cursor:pointer;background:#2a3a8e;color:#fff;
    border:2px solid #6a7be0;border-radius:8px;padding:9px 12px;font-size:15px;
    box-shadow:0 3px 0 #141c4e;}
  .chip:active{transform:translateY(2px);}
  .chip.used{visibility:hidden;}
  .ans-chip{background:#3f52c0;}

  /* choices */
  .choices{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .choice{font-family:inherit;cursor:pointer;text-align:left;
    background:#1d2550;color:#fff;border:3px solid #4a5bd0;border-radius:10px;
    padding:12px;font-size:15px;box-shadow:0 3px 0 #0a0f30;}
  .choice:active{transform:translateY(2px);}
  .choice.ok{background:#1e5a2a;border-color:#5bd66b;}
  .choice.ng{background:#5a1e1e;border-color:#ff6b6b;}

  .controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .hint{font-size:12.5px;color:#ffd24a;margin:4px 2px;min-height:18px;}
  #itemBar{text-align:center;margin:2px 0 6px;min-height:30px;}
  .btn.herb{background:#1e5a2a;border-color:#5bd66b;box-shadow:0 4px 0 #0c2a14;font-size:14px;padding:9px 14px;}
  .herb-empty{font-size:12px;color:#6a7aa8;}

  /* end */
  #endScreen{text-align:center;padding:24px 16px;}
  .confetti{font-size:30px;letter-spacing:4px;}
</style>
</head>

function makeSprite(name,scale){
  const g=SPR[name],cv=document.createElement('canvas');
  cv.width=16*scale;cv.height=16*scale;
  const x=cv.getContext('2d');
  for(let y=0;y<16;y++)for(let i=0;i<16;i++){
    const c=PAL[g[y][i]];if(c){x.fillStyle=c;x.fillRect(i*scale,y*scale,scale,scale);}
  }
  return cv;
}

/* ===== 効果音（Web Audioで合成・ファミコン風） ===== */
const AUD={ctx:null,on:true};
function actx(){
  if(!AUD.ctx){try{AUD.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AUD.on=false;}}
  if(AUD.ctx&&AUD.ctx.state==='suspended')AUD.ctx.resume();
  return AUD.ctx;
}
/* 単音：周波数/波形/長さ/音量/開始遅延/終端周波数(スイープ) */
function tone(f,type,dur,vol,at,f2){
  const c=actx();if(!c)return;
  const t0=c.currentTime+(at||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+dur+0.02);
}
/* ノイズ（打撃・かいしん用） */
function noise(dur,vol,at){
  const c=actx();if(!c)return;
  const n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource();s.buffer=b;
  const g=c.createGain();g.gain.value=vol||0.2;
  s.connect(g).connect(c.destination);s.start(c.currentTime+(at||0));
}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}

function startGame(){
  SFX.select();
  S.i=0;S.lv=1;S.maxhp=30;S.hp=30;S.party=["hero"];S.hasPriest=false;S.herbs=1;S.streak=0;
  S.order=shuffle(Q.map((q,i)=>i));   // 例文の出題順を毎回ランダムに（重複なし）
  show('battleScreen');loadBattle();
}

function renderParty(){
  const p=$('party');p.innerHTML='';
  S.party.forEach(n=>{const c=makeSprite(n,3);c.className='p';p.appendChild(c);});
}
function renderHeroHp(){
  $('hpText').textContent=S.hp+'/'+S.maxhp;
  $('heroHp').style.width=Math.max(0,S.hp/S.maxhp*100)+'%';
}

function loadBattle(){
  S.qi=S.order[S.i];               // いま出題する例文の番号（ランダム順）
  const e=ENEMIES[S.i], q=Q[S.qi];
  S.tries=0;
  $('battleNo').textContent=S.i+1;
  $('lv').textContent=S.lv;
  const es=$('enemySprite');es.innerHTML='';es.appendChild(makeSprite(e.sprite,e.scale));
  es.classList.remove('hit');
  $('enemyName').textContent=e.name;
  $('enemyHp').style.width='100%';
  renderParty();renderHeroHp();renderItems();
  $('hintLine').textContent='';
  setMsg((e.boss?'<b>'+e.name+'</b> が たちはだかった！ ':'')+'<b>'+e.name+'</b> が あらわれた！　分詞のことばで たたかえ！');
  // ミックス：1問ごとに 3択 ⇔ 並べ替え
  if(S.i%2===0) buildChoice(q); else buildSort(q);
}

function setMsg(html,cls){const m=$('msg');m.innerHTML=html;m.className=cls||'';}

/* ---- 3択 ---- */
function buildChoice(q){
  const opts=shuffle([q.en,...q.bad]);
  const area=$('quizArea');
  area.innerHTML='<div class="jp-q">'+q.jp+'</div><div class="choices" id="choices"></div>';
  const box=$('choices');
  opts.forEach(t=>{
    const b=document.createElement('button');b.className='choice';b.textContent=t;
    b.onclick=()=>{
      if(t===q.en){b.classList.add('ok');disableChoices();win(q);}
      else{b.classList.add('ng');wrong(q,b);}
    };
    box.appendChild(b);
  });
  $('controls').innerHTML='';
}
function disableChoices(){document.querySelectorAll('.choice').forEach(c=>c.onclick=null);}

/* ---- 並べ替え ---- */
let sortState=null;
function buildSort(q){
  sortState={picked:[]};
  const area=$('quizArea');
  area.innerHTML='<div class="jp-q">'+q.jp+'</div>'+
    '<div class="answer-line" id="ansLine"></div>'+
    '<div class="pool" id="pool"></div>';
  // 単語をしっかりシャッフル（最初から正解の順に並ばないよう混ぜ直す）
  let order=q.words.map((w,i)=>({w,i}));
  if(order.length>1){let n=0;do{order=shuffle(order);}while(order.every((o,p)=>o.i===p)&&n++<10);}
  const pool=$('pool');
  order.forEach(o=>{
    const c=document.createElement('button');c.className='chip';c.textContent=o.w;c.dataset.i=o.i;
    c.onclick=()=>{if(c.classList.contains('used'))return;
      c.classList.add('used');sortState.picked.push(o.i);drawAns(q);};
    pool.appendChild(c);
  });
  $('controls').innerHTML=
    '<button class="btn" id="clearBtn">けす</button>'+
    '<button class="btn primary" id="atkBtn">⚔ こうげき！</button>';
  $('clearBtn').onclick=()=>{sortState.picked=[];
    document.querySelectorAll('#pool .chip').forEach(c=>c.classList.remove('used'));drawAns(q);};
  $('atkBtn').onclick=()=>submitSort(q);
  drawAns(q);
}
function drawAns(q){
  const line=$('ansLine');line.innerHTML='';
  sortState.picked.forEach((idx,pos)=>{
    const c=document.createElement('button');c.className='chip ans-chip';c.textContent=q.words[idx];
    c.onclick=()=>{sortState.picked.splice(pos,1);
      document.querySelectorAll('#pool .chip').forEach(ch=>{if(+ch.dataset.i===idx)ch.classList.remove('used');});
      drawAns(q);};
    line.appendChild(c);
  });
}
function submitSort(q){
  if(sortState.picked.length<q.words.length){setMsg('まだ ことばが たりないよ。','msg-bad');return;}
  const ok=sortState.picked.every((idx,pos)=>idx===pos);
  if(ok) win(q); else wrong(q,null);
}

/* ---- 勝ち / まちがい ---- */
function win(q){
  S.streak++;                 // 連続正解カウントを+1
  const es=$('enemySprite');es.classList.add('hit');
  $('enemyHp').style.width='0%';
  if(S.hasPriest&&S.hp<S.maxhp){S.hp=Math.min(S.maxhp,S.hp+4);renderHeroHp();}
  const crit=Math.random()<0.28;
  if(crit){SFX.critical();}else{SFX.attack();}
  setTimeout(SFX.defeat,crit?260:160);
  const head=crit?'💥 <b style="color:#ffd24a">かいしんの いちげき！！</b>　':'⚔ こうげき！　';
  // 3問連続で正解したときだけ、やくそうを1こもらえる（もらったらカウントは0に戻す）
  let herbMsg='';
  if(S.streak>=3){S.herbs++;S.streak=0;herbMsg='　<span class="msg-good">🌿 3もん れんぞくせいかい！ やくそうを 1こ もらった！（×'+S.herbs+'）</span>';setTimeout(SFX.heal,420);}
  setMsg(head+'<b>'+q.en+'</b>　正しい分詞だ！　<span class="msg-good">'+ENEMIES[S.i].name+'を たおした！</span>'+herbMsg,'');
  renderItems();              // やくそうの数の表示を更新
  $('controls').innerHTML='<button class="btn primary" id="nextBtn">▶ つぎへ</button>';
  $('atkBtn')&&( $('atkBtn').disabled=true);
  $('nextBtn').onclick=afterWin;
}
function afterWin(){
  // レベルアップ
  S.lv++;S.maxhp+=4;S.hp=Math.min(S.maxhp,S.hp+6);
  let extra='';
  SFX.levelup();
  if(COMPANIONS[S.i]){const c=COMPANIONS[S.i];S.party.push(c.sprite);
    if(c.sprite==='priest')S.hasPriest=true;extra='　'+c.line;setTimeout(SFX.join,500);}
  S.i++;
  if(S.i>=ENEMIES.length){endGame();return;}
  renderParty();
  setMsg('<span class="msg-good">レベルアップ！ Lv.'+S.lv+'　さいだいHPが ふえた！</span>'+extra);
  // 少し見せてから次の敵
  $('quizArea').innerHTML='';$('controls').innerHTML='';
  setTimeout(loadBattle, 1300);
}
function wrong(q,btn){
  S.tries++;
  S.streak=0;                 // ミスしたら連続正解カウントは0に戻る
  SFX.miss();
  const dmg=6+S.i;
  S.hp=Math.max(0,S.hp-dmg);renderHeroHp();
  // まちがえた選択肢は押せないようにする（同じミスで二重にダメージを受けないため）
  if(btn){btn.onclick=null;btn.disabled=true;}
  if(S.hp<=0){gameOver();return;}
  // 敵は倒れない。正解するまで たたかい続ける。
  if(S.tries===1){
    $('hintLine').textContent='💡 ヒント：-ing（～している）か -ed・過去分詞（～される／された）か を考えよう！';
  }else{
    // 2回目以降は正解を見せて助ける（それでも自分で正しく答えないと倒せない）
    $('hintLine').innerHTML='✅ 正解は：<b style="color:#5bd66b">'+q.en+'</b>';
  }
  setMsg('<span class="msg-bad">ミス！ '+ENEMIES[S.i].name+'の こうげき！ '+dmg+'の ダメージ。</span> せいかいする まで たたかおう！','');
}

/* ---- やくそう（回復アイテム） ---- */
function renderItems(){
  const bar=$('itemBar');if(!bar)return;
  if(S.herbs>0){
    bar.innerHTML='<button class="btn herb" id="herbBtn">🌿 やくそうを つかう（×'+S.herbs+'）</button>';
    $('herbBtn').onclick=useHerb;
  }else{bar.innerHTML='<span class="herb-empty">🌿 やくそう ×0</span>';}
}
function useHerb(){
  if(S.herbs<=0)return;
  if(S.hp>=S.maxhp){setMsg('HPは まんたんだ！ やくそうは とっておこう。','');return;}
  S.herbs--;const heal=14;S.hp=Math.min(S.maxhp,S.hp+heal);
  SFX.heal();renderHeroHp();renderItems();
  setMsg('<span class="msg-good">🌿 やくそうを つかった！ HPが '+heal+' かいふく！</span>','');
}

/* ---- 死亡（HP0）＋棺 ---- */
function gameOver(){
  SFX.dead();
  const es=$('enemySprite');es.innerHTML='';es.classList.remove('hit');
  es.appendChild(makeSprite('coffin',10));
  $('enemyName').textContent='';$('enemyHp').style.width='0%';
  const p=$('party');p.innerHTML='';const cf=makeSprite('coffin',3);cf.className='p';p.appendChild(cf);
  setMsg('<span class="msg-bad">⚰️ ゆうしゃは しんでしまった…</span><br>でも あきらめなければ 何度でも よみがえる。','');
  $('hintLine').innerHTML='✅ 正解は：<b style="color:#5bd66b">'+Q[S.qi].en+'</b>';
  $('quizArea').innerHTML='';
  const bar=$('itemBar');if(bar)bar.innerHTML='';
  $('controls').innerHTML='<button class="btn primary" id="reviveBtn">⚰ さいしょから</button>'+
    '<button class="btn" id="contBtn">この たたかいから 再開</button>';
  $('reviveBtn').onclick=startGame;
  $('contBtn').onclick=()=>{S.hp=S.maxhp;renderHeroHp();renderParty();loadBattle();};
}

function endGame(){
  show('endScreen');SFX.clear();
  $('endText').innerHTML='勇者よ、<b style="color:#ffd24a">分詞の大魔王</b>を たおした！<br>仲間とともに 世界に へいわが もどった。<br>Lv.'+S.lv+'　なかま '+(S.party.length)+'人　おめでとう！';
  const ep=$('endParty');ep.innerHTML='';
  S.party.forEach(n=>{const c=makeSprite(n,4);ep.appendChild(c);});
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

$('startBtn').onclick=startGame;
$('againBtn').onclick=startGame;
</script>
</body>
